<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas Riviera Maya</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>

<body>
  <header class="encabezado">
    <h1>Reservas Riviera Maya</h1>
    <p>Selecciona y calcula tu experiencia turística</p>
  </header>

  <main class="contenedor">
    <section class="controles" aria-label="Controles del catálogo">
      <div class="campo campo-buscador">
        <label for="buscador" class="solo-lector">Buscar experiencia</label>
        <input id="buscador" type="search" placeholder="Buscar experiencia...">
      </div>
      <div class="campo">
        <label for="filtroCategoria" class="solo-lector">Categoría</label>
        <select id="filtroCategoria">
          <option value="todas">Todas las categorías</option>
          <option value="naturaleza">Naturaleza</option>
          <option value="cultura">Cultura</option>
          <option value="aventura">Aventura</option>
          <option value="gastronomia">Gastronomía</option>
        </select>
      </div>
      <div class="campo">
        <label for="precioMaximo" class="solo-lector">Precio máximo en pesos</label>
        <input id="precioMaximo" type="number" min="0" step="50" placeholder="Precio máximo (MXN)">
      </div>
      <div class="campo">
        <label for="ordenPrecio" class="solo-lector">Ordenar por precio</label>
        <select id="ordenPrecio">
          <option value="normal">Orden original</option>
          <option value="ascendente">Menor precio</option>
          <option value="descendente">Mayor precio</option>
        </select>
      </div>
    </section>

    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
    <p id="estado" class="estado" aria-live="polite">Cargando experiencias...</p>

    <section id="catalogo" class="catalogo" aria-label="Catálogo de experiencias"></section>

    <section class="resumen" aria-labelledby="tituloResumen">
      <h2 id="tituloResumen">Mi reservación</h2>
      <div id="listaReservas">
        <p>No hay experiencias seleccionadas.</p>
      </div>

      <div class="totales">
        <p>Personas: <span id="totalPersonas">0</span></p>
        <p class="total">Total: <span id="total">$0 MXN</span></p>
      </div>

      <div class="acciones">
        <button id="btnVaciar" class="btn-vaciar" type="button" disabled>Vaciar reservación</button>
      </div>

      <div id="confirmacion" class="confirmacion" role="alertdialog"
           aria-labelledby="textoConfirmacion" hidden>
        <p id="textoConfirmacion">¿Seguro que quieres borrar toda la reservación?</p>
        <button id="btnConfirmarVaciar" class="btn-eliminar" type="button">Sí, vaciar</button>
        <button id="btnCancelarVaciar" class="btn-cancelar" type="button">Cancelar</button>
      </div>
    </section>
  </main>

  <footer>
    <p>Proyecto académico de frontend</p>
  </footer>
</body>
</html>
